aid: expected-parrot
name: Expected Parrot
description: Expected Parrot is a research-technology company building tools for AI-powered
  social science. Its open-source Python library EDSL (Expected Parrot Domain-Specific
  Language) lets researchers design, conduct, and analyze surveys and experiments in
  which large language models power simulated AI agents that answer questions, alongside
  or in place of human respondents. The Expected Parrot platform adds remote inference
  across many model providers (Anthropic, OpenAI, Google, Mistral, and more) via a
  single Expected Parrot API key, plus cloud storage, sharing, and collaboration for
  surveys, agents, scenarios, and results. It is used for market research, data labeling,
  digital twins, synthetic-user UX studies, and reproducible computational social science.
